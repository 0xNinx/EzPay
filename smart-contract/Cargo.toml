[package]
name = "ezpay_contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "20.5.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "20.5.0", features = ["testutils", "alloc"] }

[features]
testutils = ["soroban-sdk/testutils"]

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
